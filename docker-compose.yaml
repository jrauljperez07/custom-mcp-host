version: "3.9"

services:
    mcp-host:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        volumes:
            - ./app:/app
        env_file:
            - .env
        command: >
            sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
        networks:
            - pistil-net
        restart: unless-stopped

networks:
    pistil-net:
        external: true
